name: Supabase Heartbeat

on:
  schedule:
    - cron: '0 0 */3 * *'   # Setiap 3 hari jam 00:00 UTC
  workflow_dispatch:        # Bisa trigger manual dari tab Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Heartbeat
        run: |
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          curl -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/app_heartbeat" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates" \
            -d "{\"id\":1,\"last_ping\":\"${TIMESTAMP}\"}"
          echo "✅ Pinged at ${TIMESTAMP}"
